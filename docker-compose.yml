services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-bki}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}https://git-scm.com/docs/git-init
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-bki}"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./schema:/docker-entrypoint-initdb.d
    networks:
      - internal

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - internal

  app:
    build:
      context: ./backend
      dockerfile: Dockerfile
    environment:
      # DB
      POSTGRES_DB: ${POSTGRES_DB:-bki}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      # LLM/Embeddings
      OLLAMA_BASE_URL: http://ollama:11434
      # Auth
      AUTH_MODE: ${AUTH_MODE:-hybrid}
      JWT_SECRET: ${JWT_SECRET:-qweasdzxc}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      ENABLE_BOOTSTRAP_ADMIN: ${ENABLE_BOOTSTRAP_ADMIN:-true}
      PORTAL_JWT_SECRET: ${PORTAL_JWT_SECRET:-portal_secret_change_me}
      PORTAL_JWT_ALGORITHM: ${PORTAL_JWT_ALGORITHM:-HS256}
      PORTAL_JWT_ISSUER: ${PORTAL_JWT_ISSUER:-}
      PORTAL_JWT_AUDIENCE: ${PORTAL_JWT_AUDIENCE:-}
      PORTAL_SUB_CLAIM: ${PORTAL_SUB_CLAIM:-sub}
      PORTAL_USERNAME_CLAIM: ${PORTAL_USERNAME_CLAIM:-preferred_username}
      PORTAL_ROLES_CLAIM: ${PORTAL_ROLES_CLAIM:-roles}
      PORTAL_AUTO_PROVISION_USERS: ${PORTAL_AUTO_PROVISION_USERS:-true}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    ports:
      - "8000:8000"
    networks:
      - internal

volumes:
  db_data:
  ollama_data:

networks:
  internal:

